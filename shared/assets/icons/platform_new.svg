<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5C6BC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3F51B5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Platform infrastructure -->
  <rect x="2" y="12" width="20" height="8" rx="2" fill="url(#platformGrad)" opacity="0.8"/>
  <!-- Server racks -->
  <rect x="4" y="14" width="3" height="4" rx="0.5" fill="#303F9F" opacity="0.9"/>
  <rect x="8" y="14" width="3" height="4" rx="0.5" fill="#303F9F" opacity="0.8"/>
  <rect x="12" y="14" width="3" height="4" rx="0.5" fill="#303F9F" opacity="0.9"/>
  <rect x="16" y="14" width="3" height="4" rx="0.5" fill="#303F9F" opacity="0.7"/>
  <!-- Status lights -->
  <circle cx="5.5" cy="15.5" r="0.4" fill="#4CAF50" opacity="0.9"/>
  <circle cx="9.5" cy="15.5" r="0.4" fill="#4CAF50" opacity="0.9"/>
  <circle cx="13.5" cy="15.5" r="0.4" fill="#FF9800" opacity="0.9"/>
  <circle cx="17.5" cy="15.5" r="0.4" fill="#4CAF50" opacity="0.9"/>
  <!-- Cloud connections -->
  <ellipse cx="8" cy="6" rx="4" ry="2.5" fill="#81C784" opacity="0.7"/>
  <ellipse cx="16" cy="6" rx="4" ry="2.5" fill="#81C784" opacity="0.6"/>
  <!-- Connection lines -->
  <path d="M8 8.5 L8 12" stroke="#7986CB" stroke-width="2" opacity="0.6"/>
  <path d="M16 8.5 L16 12" stroke="#7986CB" stroke-width="2" opacity="0.6"/>
  <path d="M12 9 L12 12" stroke="#7986CB" stroke-width="2" opacity="0.6"/>
  <!-- Network nodes -->
  <circle cx="12" cy="9" r="1.5" fill="#FF7043" opacity="0.8"/>
</svg>
