<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26C6DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00BCD4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Team members -->
  <circle cx="8" cy="7" r="3" fill="url(#teamGrad)" opacity="0.9"/>
  <circle cx="16" cy="7" r="3" fill="url(#teamGrad)" opacity="0.8"/>
  <circle cx="12" cy="11" r="3" fill="url(#teamGrad)" opacity="0.7"/>
  <!-- Body representation -->
  <ellipse cx="8" cy="18" rx="3" ry="4" fill="url(#teamGrad)" opacity="0.6"/>
  <ellipse cx="16" cy="18" rx="3" ry="4" fill="url(#teamGrad)" opacity="0.5"/>
  <ellipse cx="12" cy="20" rx="3" ry="2.5" fill="url(#teamGrad)" opacity="0.7"/>
  <!-- Connection lines showing teamwork -->
  <path d="M8 10 L12 8 L16 10" fill="none" stroke="#0097A7" stroke-width="1.5" opacity="0.6"/>
  <!-- Team leader indicator -->
  <circle cx="12" cy="6" r="1.5" fill="#FFD54F" opacity="0.9"/>
  <path d="M11.3 5.5 L11.7 6.3 L12.7 4.7" fill="none" stroke="#FF8F00" stroke-width="1" stroke-linecap="round"/>
</svg>
