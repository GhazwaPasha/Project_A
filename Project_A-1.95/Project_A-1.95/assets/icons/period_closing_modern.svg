<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Period Closing Icon with Calendar and Lock -->
  
  <!-- Main calendar body -->
  <rect x="5" y="5" width="14" height="14" rx="2" fill="white" opacity="0.8"/>
  
  <!-- Calendar header -->
  <rect x="5" y="5" width="14" height="4" rx="2" fill="white" opacity="0.9"/>
  
  <!-- Calendar binding holes -->
  <circle cx="8" cy="3" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="12" cy="3" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="16" cy="3" r="0.8" fill="white" opacity="0.6"/>
  
  <!-- Calendar binding rings -->
  <rect x="7.5" y="2" width="1" height="4" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="11.5" y="2" width="1" height="4" rx="0.5" fill="white" opacity="0.5"/>
  <rect x="15.5" y="2" width="1" height="4" rx="0.5" fill="white" opacity="0.5"/>
  
  <!-- Calendar grid lines -->
  <line x1="7" y1="11" x2="17" y2="11" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="7" y1="13" x2="17" y2="13" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="7" y1="15" x2="17" y2="15" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="9" y1="10" x2="9" y2="17" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="12" y1="10" x2="12" y2="17" stroke="white" stroke-width="0.5" opacity="0.4"/>
  <line x1="15" y1="10" x2="15" y2="17" stroke="white" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Period end marker (checkmark) -->
  <rect x="13" y="14" width="2" height="2" rx="0.3" fill="white" opacity="0.7"/>
  <path d="M13.4 15L14 15.6L15.6 14" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.8" fill="none"/>
  
  <!-- Lock symbol for closing -->
  <rect x="17" y="14" width="4" height="5" rx="1" fill="white" opacity="0.6"/>
  <path d="M18 16v-1.5c0-0.8 0.7-1.5 1.5-1.5s1.5 0.7 1.5 1.5V16" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.7" fill="none"/>
  <circle cx="19.5" cy="16.5" r="0.5" fill="white" opacity="0.8"/>
  
  <!-- Connection line between calendar and lock -->
  <path d="M16.5 15.5h0.5" stroke="white" stroke-width="1" opacity="0.5"/>
</svg>
