<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accountsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196F3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Account hierarchy tree -->
  <rect x="3" y="4" width="12" height="3" rx="1.5" fill="url(#accountsGrad)" opacity="0.9"/>
  <rect x="3" y="10" width="8" height="2.5" rx="1.25" fill="url(#accountsGrad)" opacity="0.7"/>
  <rect x="3" y="15" width="10" height="2.5" rx="1.25" fill="url(#accountsGrad)" opacity="0.8"/>
  <rect x="3" y="20" width="6" height="2" rx="1" fill="url(#accountsGrad)" opacity="0.6"/>
  <!-- Tree connectors -->
  <rect x="15" y="5.5" width="2" height="1" fill="#1976D2" opacity="0.6"/>
  <rect x="11" y="11" width="2" height="1" fill="#1976D2" opacity="0.6"/>
  <rect x="13" y="16" width="2" height="1" fill="#1976D2" opacity="0.6"/>
  <rect x="9" y="21" width="2" height="1" fill="#1976D2" opacity="0.6"/>
  <!-- Account symbols -->
  <circle cx="19" cy="6" r="2.5" fill="#4CAF50" opacity="0.8"/>
  <text x="19" y="7" text-anchor="middle" fill="white" font-size="8" font-weight="bold">$</text>
  <!-- Folder icons for categories -->
  <rect x="17" y="12" width="4" height="3" rx="0.5" fill="#FF9800" opacity="0.7"/>
  <rect x="17" y="11" width="2" height="1" rx="0.5" fill="#FF9800" opacity="0.7"/>
</svg>
