<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern Balance Icon with Equal Sides -->
  <rect x="11" y="3" width="2" height="8" fill="white" opacity="0.8"/>
  
  <!-- Balance beam -->
  <rect x="4" y="10" width="16" height="1.5" rx="0.75" fill="white" opacity="0.9"/>
  
  <!-- Left scale -->
  <path d="M7 11.5L5 16h4l-2-4.5z" fill="white" opacity="0.7"/>
  <rect x="4.5" y="16" width="5" height="1" rx="0.5" fill="white" opacity="0.8"/>
  
  <!-- Right scale -->
  <path d="M17 11.5L15 16h4l-2-4.5z" fill="white" opacity="0.7"/>
  <rect x="14.5" y="16" width="5" height="1" rx="0.5" fill="white" opacity="0.8"/>
  
  <!-- Balance point -->
  <circle cx="12" cy="11" r="1.5" fill="white" opacity="0.9"/>
  
  <!-- Base -->
  <rect x="10" y="19" width="4" height="2" rx="1" fill="white" opacity="0.6"/>
</svg>
