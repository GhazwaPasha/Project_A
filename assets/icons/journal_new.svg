<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="journalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Journal book -->
  <rect x="4" y="2" width="16" height="20" rx="2" fill="url(#journalGrad)" opacity="0.9"/>
  <rect x="4" y="2" width="3" height="20" rx="2" fill="#2E7D32" opacity="0.8"/>
  <!-- Lines representing entries -->
  <rect x="9" y="6" width="8" height="1" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="9" y="8.5" width="6" height="1" rx="0.5" fill="white" opacity="0.6"/>
  <rect x="9" y="11" width="9" height="1" rx="0.5" fill="white" opacity="0.7"/>
  <rect x="9" y="13.5" width="7" height="1" rx="0.5" fill="white" opacity="0.6"/>
  <rect x="9" y="16" width="8" height="1" rx="0.5" fill="white" opacity="0.5"/>
  <!-- Bookmark -->
  <rect x="17" y="2" width="2" height="8" fill="#FF7043" opacity="0.9"/>
  <polygon points="17,10 19,10 18,8" fill="#FF7043" opacity="0.9"/>
