<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="settingsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#78909C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#607D8B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main gear -->
  <circle cx="12" cy="12" r="7" fill="url(#settingsGrad)" opacity="0.8"/>
  <circle cx="12" cy="12" r="3.5" fill="#546E7A" opacity="0.9"/>
  <circle cx="12" cy="12" r="1.5" fill="white" opacity="0.8"/>
  <!-- Gear teeth -->
  <rect x="10" y="2" width="4" height="3" rx="1" fill="url(#settingsGrad)" opacity="0.8"/>
  <rect x="10" y="19" width="4" height="3" rx="1" fill="url(#settingsGrad)" opacity="0.8"/>
  <rect x="2" y="10" width="3" height="4" rx="1" fill="url(#settingsGrad)" opacity="0.8"/>
  <rect x="19" y="10" width="3" height="4" rx="1" fill="url(#settingsGrad)" opacity="0.8"/>
  <!-- Diagonal teeth -->
  <rect x="5.5" y="4.5" width="3" height="3" rx="1" fill="url(#settingsGrad)" opacity="0.7" transform="rotate(45 7 6)"/>
  <rect x="15.5" y="4.5" width="3" height="3" rx="1" fill="url(#settingsGrad)" opacity="0.7" transform="rotate(-45 17 6)"/>
  <rect x="5.5" y="16.5" width="3" height="3" rx="1" fill="url(#settingsGrad)" opacity="0.7" transform="rotate(-45 7 18)"/>
  <rect x="15.5" y="16.5" width="3" height="3" rx="1" fill="url(#settingsGrad)" opacity="0.7" transform="rotate(45 17 18)"/>
  <!-- Secondary smaller gear -->
  <circle cx="18" cy="6" r="3" fill="#FF9800" opacity="0.8"/>
  <circle cx="18" cy="6" r="1.5" fill="#F57C00" opacity="0.9"/>
  <circle cx="18" cy="6" r="0.7" fill="white" opacity="0.8"/>
  <!-- Small gear teeth -->
  <rect x="17" y="2" width="2" height="1.5" rx="0.5" fill="#FF9800" opacity="0.7"/>
  <rect x="17" y="8.5" width="2" height="1.5" rx="0.5" fill="#FF9800" opacity="0.7"/>
  <rect x="15" y="5" width="1.5" height="2" rx="0.5" fill="#FF9800" opacity="0.7"/>
  <rect x="19.5" y="5" width="1.5" height="2" rx="0.5" fill="#FF9800" opacity="0.7"/>
</svg>
